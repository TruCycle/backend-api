name: Backend checks

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared package manager
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Isolated unit tests
        if: success() || failure()
        run: npm run test:unit
      - name: Build
        if: success() || failure()
        run: npm run build
